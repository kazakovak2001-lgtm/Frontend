name: INTEGRATION-1A Runtime Config Wiring

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/integration-1a-runtime-config-fix.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.ref == 'agent/integration-1a-runtime-wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integration-1a-runtime-wiring
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Wire REST client to shared runtime endpoints
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/backendApi.ts')
          source = path.read_text()
          import_anchor = 'import type { ChatMessage, Project, User } from "@/types";\n'
          config_anchor = '''const API_BASE_URL = (\n  (import.meta.env.VITE_API_URL as string | undefined) ??\n  "http://localhost:5000/api"\n).replace(/\\/$/, "");\n'''

          assert source.count(import_anchor) == 1, 'expected one backend API import anchor'
          assert source.count(config_anchor) == 1, 'expected one legacy API URL block'

          source = source.replace(
              import_anchor,
              import_anchor + 'import { runtimeEndpoints } from "@/config/runtime";\n',
          )
          source = source.replace(
              config_anchor,
              'const API_BASE_URL = runtimeEndpoints.apiBaseUrl;\n',
          )
          path.write_text(source)
          PY
      - name: Verify bounded change
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          changed="$(git diff --name-only)"
          test "$changed" = "src/services/backendApi.ts"
          git diff --check
      - name: Commit REST runtime wiring
        run: |
          git add -- src/services/backendApi.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(integration): use shared runtime endpoints for REST'
          git push origin HEAD:agent/integration-1a-runtime-wiring
