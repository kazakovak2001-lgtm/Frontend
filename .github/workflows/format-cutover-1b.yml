name: Format CUTOVER-1B Files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format CUTOVER-1B files
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            Dockerfile \
            .dockerignore \
            package.json \
            scripts/runtime/frontend-node-server.mjs \
            scripts/runtime/serve-frontend.mjs \
            scripts/qa/workspace-responsive-qa.mjs \
            docs/CUTOVER-1B_FRONTEND_SSR_RELEASE.md
      - name: Validate runtime syntax
        run: |
          node --check scripts/runtime/frontend-node-server.mjs
          node --check scripts/runtime/serve-frontend.mjs
          node --check scripts/qa/workspace-responsive-qa.mjs
      - name: Publish formatted files
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1b-formatted-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/ci.yml
            Dockerfile
            .dockerignore
            package.json
            scripts/runtime/frontend-node-server.mjs
            scripts/runtime/serve-frontend.mjs
            scripts/qa/workspace-responsive-qa.mjs
            docs/CUTOVER-1B_FRONTEND_SSR_RELEASE.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
