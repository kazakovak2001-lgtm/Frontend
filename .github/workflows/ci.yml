name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  workspace-tests:
    name: Workspace Logic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:workspace

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Publish production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-${{ github.sha }}
          path: .output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  responsive-qa:
    name: Responsive Workspace QA
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-${{ github.sha }}
          path: .output
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify responsive Workspace
        run: node scripts/qa/workspace-responsive-qa.mjs
      - name: Publish responsive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-responsive-qa-${{ github.sha }}
          path: artifacts/workspace-responsive
          if-no-files-found: warn
          retention-days: 14
