name: Apply Autonomous Contract Typo Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-contract-identifier:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Replace exact misspelled identifier
        run: |
          test "$(grep -o 'autonmous' scripts/e2e-backend.mjs | wc -l)" = "1"
          sed -i 's/autonmous/autonomous/' scripts/e2e-backend.mjs
          test "$(grep -o 'autonmous' scripts/e2e-backend.mjs | wc -l)" = "0"
          node --check scripts/e2e-backend.mjs
      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e-backend.mjs
          git commit --no-verify -m "fix(contract): correct autonomous session identifier"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
