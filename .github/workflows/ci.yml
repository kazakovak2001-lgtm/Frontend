name: RUNTIME-205 Contract Fixer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-205-contract-fixer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable companion branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-205-bounded-preview-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply exact contract patch
        run: python scripts/runtime205-contract-fixer.py
      - name: Install dependencies
        run: npm ci
      - name: Format contract
        run: npx prettier --write scripts/e2e-backend.mjs
      - name: Validate syntax
        run: node --check scripts/e2e-backend.mjs
      - name: Validate changed-file lint
        run: npx eslint scripts/e2e-backend.mjs
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Validate workspace logic
        run: npm run test:workspace
      - name: Validate production build
        run: npm run build
      - name: Restore canonical CI and remove fixer
        run: |
          git fetch origin agent/runtime-204-preview-terminal-contract
          git checkout origin/agent/runtime-204-preview-terminal-contract -- .github/workflows/ci.yml
          git rm -f scripts/runtime205-contract-fixer.py
      - name: Commit validated contract only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
            exit 0
          fi
          git commit -m "test(runtime): verify bounded autonomous preview"
          git push origin HEAD:agent/runtime-205-bounded-preview-contract
