name: Apply Frontend Lint Baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Stabilize history dependency
        run: |
          node <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "src/routes/projects.$projectId.tsx";
          const before = "  const history = workspaceData?.history ?? [];";
          const after = [
            "  const history = useMemo(",
            "    () => workspaceData?.history ?? [],",
            "    [workspaceData?.history],",
            "  );",
          ].join("\n");
          const source = await readFile(path, "utf8");

          if (source.includes(before)) {
            await writeFile(path, source.replace(before, after));
          } else if (!source.includes(after)) {
            throw new Error("Expected workspace history initialization was not found");
          }
          NODE
      - name: Validate quality baseline
        run: |
          npm run format
          npm run typecheck
          npm run lint
          npm run format:check
      - name: Commit lint baseline
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/projects.\$projectId.tsx
          git commit -m "fix(workspace): stabilize history dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
