name: Apply RUNTIME-204 Contract Fix

on:
  push:
    branches:
      - agent/runtime-204-preview-terminal-contract

permissions:
  contents: write

jobs:
  apply-contract-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-204-preview-terminal-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply autonomous preview contract
        run: python scripts/runtime/apply-runtime-204-contract.py
      - name: Format and validate
        run: |
          npx prettier --write scripts/e2e-backend.mjs
          node --check scripts/e2e-backend.mjs
          npm run lint
          npm run test:workspace
          npm run build
      - name: Commit contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e-backend.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "fix(contract): accept autonomous preview terminal state"
          git push origin HEAD:agent/runtime-204-preview-terminal-contract
